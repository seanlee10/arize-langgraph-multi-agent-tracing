[project]
name = "research-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "lg-tracing",
    "langgraph>=1.2.18",
    "langchain-anthropic",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "mcp>=2.3,<3",
]

[tool.uv.sources]
lg-tracing = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]
