[project]
name = "websearch-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "lg-tracing",
    "mcp>=2.3,<3",
    "tavily-python>=0.7",
]

[project.scripts]
websearch-mcp = "websearch_mcp.server:main"

[tool.uv.sources]
lg-tracing = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/websearch_mcp"]
