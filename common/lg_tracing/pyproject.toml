[project]
name = "lg-tracing"
version = "0.1.0"
description = "OpenInference tracing setup and propagation helpers shared by every service"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "openinference-semantic-conventions",
    "openinference-instrumentation",
    "openinference-instrumentation-langchain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lg_tracing"]
